  事实证明不管是Featherline还是HRT Tracker又或是别的什么GAHT记录网站，推算模型的初始精度都非常不尽人意。昨天我在测完三项的几分钟后专门截了个图方便对比血药浓度，当时模型推算的E2为125pg/ml，但实际上E2只有44.41pg/ml，误差率高达64.5%。
